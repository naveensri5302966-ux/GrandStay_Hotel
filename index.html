<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F7FC1" />
    <meta name="description" content="Grand Stay - Travel & Tour Booking Web Application with luxury package management, offline capabilities, and accessible booking." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Grand Stay • Travel & Tour Booking</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").then(
            (reg) => console.log("%c[PWA] Service Worker registered with scope:", "color: #10B981; font-weight: bold;", reg.scope),
            (err) => console.log("[PWA] Service Worker registration failed:", err)
          );
        });
      }
    </script>
  </body>
</html>
